  <!-- HERO SECTION (Single-Screen Editorial Photographic Layout) -->
  <!-- ========================================================= -->
  <main class="hero-section" id="hero">
    
    <!-- Top Header Navigation -->
    <header class="hero-header">
      <a href="#hero" class="brand-identity" aria-label="ATBUDEVS Home">
        <img 
          src="atbu-removebg-preview.png" 
          alt="ATBU Developers Club Official Seal" 
          class="brand-logo"
          width="44"
          height="44"
        />
        <div class="brand-naming">
          <span class="brand-title">ATBU<span class="brand-accent">DEVS</span></span>
          <span class="brand-subtitle">Developers Club</span>
        </div>
      </a>

      <nav class="hero-nav" aria-label="Main Navigation">
        <a href="CONSTITUTION.md" class="nav-item" target="_blank" rel="noopener noreferrer">Constitution</a>
        <a href="DESIGN_SYSTEM.md" class="nav-item" target="_blank" rel="noopener noreferrer">Design System</a>
        <a href="#join" class="nav-item nav-action">Join Club</a>
      </nav>
    </header>

    <!-- Hero Content (Left-Aligned, High-Contrast Typography Hierarchy) -->
    <div class="hero-body">
      <div class="hero-content">
        
        <!-- Main Headline: Editorial Contrast between Light 300 and ExtraBold 850 -->
        <h1 class="hero-headline">
          <span class="headline-light">Build real software.</span>
          <span class="headline-bold">Grow as a developer.</span>
        </h1>

        <!-- Supporting Paragraph: 2–3 Concise Lines -->
        <p class="hero-description">
          ATBUDEVS brings students together to learn modern programming, collaborate on real projects, and build practical engineering skills alongside fellow developers.
        </p>

        <!-- Single Primary CTA (Pill with Arrow Icon Circle) -->
        <div class="hero-actions">
          <a href="#join" class="btn-pill-cta" id="hero-primary-cta" aria-label="Explore Community">
            <span class="btn-pill-icon-wrap" aria-hidden="true">
              <svg class="btn-pill-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </span>
            <span class="btn-pill-text">Explore Community</span>
          </a>
        </div>

      </div>
    </div>

  </main>
